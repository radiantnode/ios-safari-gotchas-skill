<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>theme-color probe: control</title>
<style>
html,body{margin:0}
body{background:#ff00ff;font:15px/1.35 -apple-system,system-ui,sans-serif}
.s{height:4000px;background:repeating-linear-gradient(#fff 0 20px,#bbb 20px 40px)}
#r a{color:#00e}
#r{position:fixed;left:8px;top:120px;z-index:2;background:#fff;color:#000;border:2px solid #000;padding:6px 8px;max-width:70%;white-space:pre-wrap}

</style></head>
<body>
<div class="s"></div>
<div id="r"><span id="rv"></span>
<a href="../../#expanded-control">What this tests</a></div>
<script>
// theme-color probe "control". body magenta, theme-color none, stripes white/gray.
// Scrolls to 1500 by itself 30s after load, so one run gives a top shot and a mid-page shot.
const t0 = Date.now();
addEventListener('load', () => setTimeout(() => scrollTo(0, 1500), 30000));
setInterval(() => { rv.textContent = 'control\ntheme-color none\n' +
  'iH ' + innerHeight + '  y ' + Math.round(scrollY) + '  t ' + Math.round((Date.now() - t0) / 1000) + 's'; }, 300);
</script>
</body></html>
